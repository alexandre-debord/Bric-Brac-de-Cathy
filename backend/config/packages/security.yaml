security:
    # Le hasher est branché sur l'INTERFACE, pas sur ta classe.
    # 'auto' laisse Symfony choisir le meilleur algorithme disponible sur ton PHP
    # (Argon2id si sodium est actif, bcrypt sinon) et migrer automatiquement
    # les anciens hashs le jour où l'algorithme par défaut change.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Le provider dit à Symfony COMMENT retrouver un utilisateur à partir
    # de son identifiant. 'property' doit désigner la même propriété que
    # celle renvoyée par getUserIdentifier() dans ton entité.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Désactive toute sécurité sur les outils de dev (profiler, assets).
        # Sans ça, la barre de debug déclenche des authentifications parasites.
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # FIREWALL 1 — délivrance du token.
        # Il ne couvre QUE la route de login. C'est le point critique :
        # les firewalls sont évalués dans l'ordre du fichier, et le PREMIER
        # dont le pattern correspond traite la requête, à l'exclusion des autres.
        # Placé après 'api', il ne serait jamais atteint.
        login:
            pattern: ^/api/login_check$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                # Par défaut json_login attend les clés "username" et "password"
                # dans le corps JSON. On redirige la première vers "email".
                username_path: email
                password_path: password
                # Ces deux handlers viennent de Lexik : le premier fabrique
                # et renvoie le JWT après une authentification réussie,
                # le second formate l'échec en JSON plutôt qu'en page HTML.
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # FIREWALL 2 — consommation du token.
        # Couvre tout le reste de l'API. Authentifie en lisant l'en-tête
        # Authorization: Bearer <token>, sans jamais toucher au mot de passe.
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    # Évalué APRÈS le firewall, sur la première règle qui matche.
    # L'ordre est donc décroissant en spécificité : les exceptions publiques
    # d'abord, la règle générale en dernier.
    access_control:
        - { path: ^/api/produits, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/categories, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check,    roles: PUBLIC_ACCESS }
        - { path: ^/api/register,       roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password,  roles: PUBLIC_ACCESS }
        - { path: ^/api/produits, roles: ROLE_ADMIN }
        - { path: ^/api/categories, roles: ROLE_ADMIN }
        - { path: ^/api,                roles: IS_AUTHENTICATED_FULLY }